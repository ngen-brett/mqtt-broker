on: [push]

jobs:
  container-build-arm64:
    runs-on: ubuntu-latest
    name: Build app container for arm64
    permissions:
      packages: write
    steps:
      - name: Checkout local
        uses: actions/checkout@v4

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decrypt secrets
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -iter 20000 -pbkdf2 -in .github/workflows/secrets/id_ed25519.enc -out .github/workflows/secrets/id_ed25519 -k ${ENCRYPTION_KEY}

      - name: Setup SSH agent
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          chmod 0600 .github/workflows/secrets/id_ed25519
          ssh-add .github/workflows/secrets/id_ed25519

      - name: Checkout app
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: git clone git@github.com:${{ github.repository }}

      - name: Build and push Docker image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:latest-arm64
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=${{ github.repository }}-arm64

      - name: Get output time
        run: echo "the time was ${{ steps.build.time }}"
